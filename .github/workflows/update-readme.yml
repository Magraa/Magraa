name: Update README activity

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch recent activity and update README
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Magraa
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, re, datetime

          user = os.environ.get("GH_USER", "Magraa")
          pat = os.environ.get("GH_PAT", "").strip()
          github_token = os.environ.get("GITHUB_TOKEN", "").strip()

          tokens = [t for t in [pat, github_token] if t]
          token_idx = 0

          def gh_get(url):
              global token_idx
              while True:
                  token = tokens[token_idx] if token_idx < len(tokens) else ""
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": user,
                  }
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      if e.code in (401, 403) and token_idx < len(tokens):
                          print(f"::warning::Token {token_idx} returned HTTP {e.code}. Trying fallback authentication...")
                          token_idx += 1
                          continue
                      raise

          try:
              events = gh_get(f"https://api.github.com/users/{user}/events?per_page=50")
              push_events = [ev for ev in events if ev.get("type") == "PushEvent"]
              print(f"::notice::Fetched {len(events)} events, {len(push_events)} PushEvents")
          except Exception as e:
              print(f"::warning::Could not fetch GitHub activity ({e}). Keeping existing README content.")
              exit(0)

          commits = []
          for ev in push_events:
              if len(commits) >= 5:
                  break
              repo = ev["repo"]["name"]
              sha = ev.get("payload", {}).get("head") or ev.get("payload", {}).get("after")
              if not sha:
                  continue
              try:
                  cdata = gh_get(f"https://api.github.com/repos/{repo}/commits/{sha}")
                  msg = cdata["commit"]["message"].splitlines()[0].strip()
                  if len(msg) > 72:
                      msg = msg[:69] + "..."
                  commits.append({
                      "repo": repo,
                      "sha": sha[:7],
                      "full_sha": sha,
                      "msg": msg,
                      "date": ev["created_at"][:10],
                  })
              except urllib.error.HTTPError as e:
                  print(f"::warning::skip {repo}@{sha[:7]}: HTTP {e.code}")
                  continue

          REPO_ICON = {
              "shoboti": "🛍️",
              "finaudit": "🔍",
              "tenderflow": "📑",
              "simvox": "📱",
              "propercoupons": "🎫",
              "mrproper": "🧴",
              "proper-perks": "🧴",
              "mr-proper": "🧴",
              "coupletrust": "🤝",
              "rentperfect": "🏠",
              "tender-bill-automation": "📑",
              "tender-automation": "📑",
              "ai-expense-tracker": "💰",
              "adb-developer-studio": "🧭",
              "magraa": "📄",
          }

          def icon_for(repo_short):
              key = repo_short.lower()
              for needle, icon in REPO_ICON.items():
                  if needle in key:
                      return icon
              return "🔧"

          if commits:
              rows = []
              for c in commits:
                  repo_short = c["repo"].split("/")[-1]
                  commit_url = f"https://github.com/{c['repo']}/commit/{c['full_sha']}"
                  repo_url = f"https://github.com/{c['repo']}"
                  icon = icon_for(repo_short)
                  rows.append(
                      f"| `{c['date']}` | {icon} [**{repo_short}**]({repo_url}) | {c['msg']} | [`{c['sha']}`]({commit_url}) |"
                  )
              block = (
                  "| Date | Repo | Commit | SHA |\n"
                  "|:---|:---|:---|:---|\n"
                  + "\n".join(rows)
              )
          else:
              block = "_No recent push activity found._"

          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          block += f"\n\n<sub>🔄 Auto-updated {now} via GitHub Actions.</sub>"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"(<!--LATEST_ACTIVITY:START-->)(.*?)(<!--LATEST_ACTIVITY:END-->)",
              lambda m: m.group(1) + "\n" + block + "\n" + m.group(3),
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: auto-update latest activity [skip ci]"
          git push
